<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Главная</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Фон — как раньше */
    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #000000,
        #1a0026,
        #2d0044,
        #4b006e,
        #2d0044,
        #1a0026,
        #000000
      );
      background-size: 500% 500%;
      animation: gradientShift 18s ease infinite;
      color: #e0d0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Навбар — компактный по центру */
    nav {
      padding: 1.2rem 0;
      background: rgba(8, 0, 16, 0.6);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(80, 40, 120, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
    }

    .nav-links a {
      color: #d0b8ff;
      text-decoration: none;
      font-size: 1.15rem;
      padding: 0.55rem 1.2rem;
      border-radius: 12px;
      background: rgba(30, 5, 40, 0.3);
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 1px solid transparent;
    }

    .nav-links a:hover {
      transform: translateY(-3px) scale(1.04);
      background: rgba(60, 20, 90, 0.5);
      color: #ffffff;
      box-shadow:
        0 4px 12px rgba(90, 40, 160, 0.4),
        0 0 0 2px rgba(120, 80, 200, 0.2);
      border-color: rgba(130, 90, 220, 0.4);
    }

    /* Основной контент — фиксированная ширина + центр */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* ⬅️ Важно: теперь начинаем с верха */
      min-height: calc(100vh - 70px); /* минус высота навбара */
      padding: 3rem 1rem 2rem; /* больше отступа сверху */
      position: relative;
    }

    /* Центральная часть — фото + информация */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      z-index: 10;
      margin-top: 2rem; /* ⬆️ Подняли центр выше */
    }

    .avatar {
      width: 400px;
      height: 400px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(100, 50, 200, 0.6);
      border: 3px solid rgba(150, 100, 255, 0.4);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .info-box {
      background: rgba(12, 0, 20, 0.5);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(80, 40, 120, 0.3);
      backdrop-filter: blur(6px);
      max-width: 500px;
      text-align: center;
    }

    .info-box h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    .info-box p {
      font-size: 1.1rem;
      line-height: 1.5;
    }

    /* Боковые панели — переливание с фоном */
    .sidebar-left, .sidebar-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 250px;
      padding: 1.5rem;
      border-radius: 16px;
      backdrop-filter: blur(5px);
      z-index: 5;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .sidebar-left {
      left: -280px;
      background: linear-gradient(135deg, #000000, #1a0026, #2d0044);
      border: 1px solid rgba(80, 40, 120, 0.2);
      animation: slideInFadeLeft 1.2s ease-out forwards;
    }

    .sidebar-right {
      right: -280px;
      background: linear-gradient(135deg, #000000, #1a0026, #2d0044);
      border: 1px solid rgba(80, 40, 120, 0.2);
      animation: slideInFadeRight 1.2s ease-out forwards;
    }

    @keyframes slideInFadeLeft {
      from {
        left: -280px;
        opacity: 0;
        background: linear-gradient(135deg, #000000, #000000, #000000);
      }
      to {
        left: 20px;
        opacity: 0.85;
        background: linear-gradient(135deg, #000000, #1a0026, #2d0044);
      }
    }

    @keyframes slideInFadeRight {
      from {
        right: -280px;
        opacity: 0;
        background: linear-gradient(135deg, #000000, #000000, #000000);
      }
      to {
        right: 20px;
        opacity: 0.85;
        background: linear-gradient(135deg, #000000, #1a0026, #2d0044);
      }
    }

    .sidebar-left h2, .sidebar-right h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      text-align: center;
      color: #d0b8ff;
    }

    /* Адаптивность */
    @media (max-width: 1024px) {
      .sidebar-left, .sidebar-right {
        display: none;
      }
      .center-content {
        width: 100%;
      }
      .avatar {
        width: 300px;
        height: 300px;
      }
    }

    @media (max-width: 768px) {
      .main-container {
        padding: 1rem;
      }
      .info-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Навбар -->
  <nav>
    <div class="nav-links">
      <a href="songs.html">Песни</a>
      <a href="index.html">Главная</a>
      <a href="projects.html">Проекты</a>
    </div>
  </nav>

  <!-- Основной контент -->
  <div class="main-container">
    <!-- 🔵 Левая панель — Песни -->
    <div class="sidebar-left">
      <h2>🎵 Мои песни</h2>
      <p>Пока пусто... но скоро здесь появятся треки.</p>
    </div>

    <!-- 🔴 Центр — фото + информация -->
    <div class="center-content">
      <img src="im.png" alt="Моя фотография" class="avatar">

      <div class="info-box">
        <h2>Добро пожаловать</h2>
        <p id="info-text">Загружается...</p>
      </div>
    </div>

    <!-- 🟡 Правая панель — Проекты -->
    <div class="sidebar-right">
      <h2>🛠️ Мои проекты</h2>
      <p>Пока пусто... но скоро здесь появятся мои работы.</p>
    </div>
  </div>

  <!-- JavaScript для загрузки info.txt -->
  <script>
    fetch('info.txt')
      .then(response => response.text())
      .then(text => {
        document.getElementById('info-text').textContent = text.trim();
      })
      .catch(err => {
        document.getElementById('info-text').textContent = "Не удалось загрузить информацию.";
        console.error("Ошибка загрузки info.txt:", err);
      });
  </script>
</body>
</html>
