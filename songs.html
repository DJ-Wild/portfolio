<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Песни</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #000000,
        #1a0026,
        #2d0044,
        #4b006e,
        #2d0044,
        #1a0026,
        #000000
      );
      background-size: 500% 500%;
      animation: gradientShift 18s ease infinite;
      color: #e0d0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Навбар */
    nav {
      padding: 1.2rem 0;
      background: rgba(8, 0, 16, 0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 1.4rem;
    }

    .nav-links a {
      color: #d0b8ff;
      text-decoration: none;
      font-size: 1.15rem;
      padding: 0.55rem 1.2rem;
      border-radius: 12px;
      background: transparent;
      transition: all 0.25s ease;
    }

    .nav-links a:hover {
      background: rgba(50, 15, 80, 0.5);
      box-shadow: inset 0 0 12px rgba(120, 80, 220, 0.4);
      color: #ffffff;
      transform: translateY(-2px) scale(1.02);
    }

    /* Контейнер для песен */
    .songs-container {
      padding: 2rem 1.2rem 3rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2.2rem;
      max-width: none;
      margin: 0 auto;
    }

    /* ОГРОМНЫЕ карточки — десктоп */
    .song-card {
      height: 640px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.7s forwards;
    }

    .song-card:nth-child(1) { animation-delay: 0.1s; }
    .song-card:nth-child(2) { animation-delay: 0.2s; }
    .song-card:nth-child(3) { animation-delay: 0.3s; }
    .song-card:nth-child(4) { animation-delay: 0.4s; }
    .song-card:nth-child(5) { animation-delay: 0.5s; }
    .song-card:nth-child(6) { animation-delay: 0.6s; }
    .song-card:nth-child(7) { animation-delay: 0.7s; }
    .song-card:nth-child(8) { animation-delay: 0.8s; }
    .song-card:nth-child(9) { animation-delay: 0.9s; }
    .song-card:nth-child(10) { animation-delay: 1.0s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .song-card:hover {
      transform: translateY(-10px) scale(1.015);
      box-shadow: 0 16px 40px rgba(100, 50, 200, 0.6);
      z-index: 2;
    }

    .song-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
      border-radius: 20px;
    }

    .song-card:hover img {
      transform: scale(1.04);
    }

    .song-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
      padding: 2rem 1.4rem;
      color: white;
      border-radius: 0 0 20px 20px;
    }

    .song-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .song-desc {
      font-size: 1.2rem;
      opacity: 0.95;
      line-height: 1.5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: #a090b0;
      font-style: italic;
      font-size: 1.2rem;
    }

    /* ✅ ИСПРАВЛЕННЫЙ МОБИЛЬНЫЙ БЛОК */
    @media (max-width: 900px) {
      .songs-container {
        grid-template-columns: 1fr;
        gap: 2rem;
        padding: 1.5rem;
      }

      .song-card {
        height: auto;
        width: 100%;
        aspect-ratio: 1 / 1; /* КВАДРАТ! */
        border-radius: 16px;
        position: relative;
        padding: 0;
        /* Сброс десктопных стилей */
        transform: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .song-card img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
      }

      .song-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
        padding: 1.8rem 1.2rem;
        color: white;
        border-radius: 0 0 16px 16px;
      }

      .song-title {
        font-size: 1.5rem;
      }

      .song-desc {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Навбар -->
  <nav>
    <div class="nav-links">
      <a href="songs.html">Песни</a>
      <a href="index.html">Главная</a>
      <a href="projects.html">Проекты</a>
    </div>
  </nav>

  <!-- Контейнер для песен -->
  <div class="songs-container" id="songs-container">
    <div class="loading">Загрузка песен...</div>
  </div>

  <script>
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"(.*)"$/, '$1'));
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"' && (j === 0 || line[j - 1] !== '\\')) {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            values.push(current.trim().replace(/^"(.*)"$/, '$1'));
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current.trim().replace(/^"(.*)"$/, '$1'));

        if (values.length === headers.length) {
          const obj = {};
          headers.forEach((header, idx) => {
            obj[header] = values[idx] || '';
          });
          result.push(obj);
        }
      }
      return result;
    }

    async function loadSongs() {
      const container = document.getElementById('songs-container');
      try {
        const res = await fetch('songs-page.csv');
        if (!res.ok) throw new Error('Файл не найден');
        const text = await res.text();
        const songs = parseCSV(text);

        if (songs.length === 0) {
          container.innerHTML = '<p class="loading">Список песен пуст</p>';
          return;
        }

        container.innerHTML = '';
        songs.forEach(song => {
          if (!song.Название || !song.Обложка || !song.Ссылка) return;

          const imagePath = `image/${song.Обложка}`;

          const card = document.createElement('a');
          card.href = song.Ссылка;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = 'song-card';

          card.innerHTML = `
            <img src="${imagePath}" alt="${song.Название}">
            <div class="song-overlay">
              <div class="song-title">${song.Название}</div>
              <div class="song-desc">${song.Описание || ''}</div>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p class="loading" style="color:#ff8080;">Ошибка загрузки песен</p>';
        console.error('Ошибка:', err);
      }
    }

    loadSongs();
  </script>
</body>
</html>
